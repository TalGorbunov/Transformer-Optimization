[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnnformer"
version = "1.0.0"
description = "GNN-style message passing in a frozen vision-language transformer: attention fencing, learned carrier tokens, scratchpad readout (MSc thesis, Tal Gorbunov)"
requires-python = ">=3.9"
# Working versions pinned from the shared .venv on 2026-07-30 (thesis-number reproducibility).
# NOTE: never pip-install into the shared cluster .venv without approval (CLAUDE.md).
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.6",
    "bitsandbytes==0.48.2",
    "accelerate==1.10.1",
    "peft==0.17.1",
    "datasets==4.5.0",
    "scikit-learn==1.6.1",
    "numpy==2.0.2",
    "pillow==11.3.0",
    "matplotlib==3.9.4",
    "num2words==0.5.14",
    "huggingface-hub>=0.34.0,<1.0",
]

[tool.setuptools.packages.find]
include = ["gnnformer", "gnnformer.*"]
