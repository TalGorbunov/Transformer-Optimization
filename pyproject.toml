[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-optimization"
version = "0.1.0"
description = "Local research scripts for transformer optimization experiments."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["models", "models.*", "evaluations", "evaluations.*"]
