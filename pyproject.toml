[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "2.0.0"
description = "Fenced per-frame encoding + evidence gate + gated read on a frozen VLM, evaluated on the official MMReD benchmark (MSc thesis, Tal Gorbunov)"
requires-python = ">=3.10"
# Same pinned model stack as the 2026-07-30 .venv (thesis-number reproducibility), now on
# Python 3.11 so the official mmred generator/renderer (requires >=3.10) lives in the SAME env.
# Build: see ~/.claude/plans/ok-i-want-to-nifty-brook.md §7.4. Never pip-install into a shared
# env without asking (CLAUDE.md).
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.6",
    "bitsandbytes==0.48.2",
    "accelerate==1.10.1",
    "peft==0.17.1",
    "datasets>=4.5,<6",
    "scikit-learn>=1.6",
    "numpy>=2.0",
    "pillow>=11",
    "matplotlib>=3.9",
    "huggingface-hub>=0.34.0,<1.0",
    "regex",
    "json_repair",
]

[project.optional-dependencies]
# the official benchmark package, installed editable from the pinned clone:
#   pip install -e "data/mmred_hf/upstream_repo[viz]"
# (not a PyPI dependency: Fr0do/mmred has no release and no LICENSE file — internal use)
legacy = ["nnsight==0.5.12"]   # only legacy/ (pre-July-2026) code imports nnsight

[tool.setuptools.packages.find]
include = ["core", "core.*"]
